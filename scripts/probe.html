<!doctype html>
<html>
<body style="margin:0">
<script>
const checks = [];
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function check(name, actual, expected) {
	const pass = typeof expected === 'function' ? expected(actual) : String(actual) === String(expected);
	checks.push({ name, actual: String(actual), pass });
}

/** Loads the built page in an iframe of the given size and resolves once hydrated. */
function load(src, width = 1100, height = 800) {
	return new Promise((resolve) => {
		const frame = document.createElement('iframe');
		frame.style.cssText = `width:${width}px;height:${height}px;border:0`;
		frame.src = src;
		frame.onload = async () => {
			for (let i = 0; i < 100 && !frame.contentWindow.__hydrated; i++) await sleep(50);
			resolve({ doc: frame.contentDocument, win: frame.contentWindow });
		};
		document.body.append(frame);
	});
}

/** Visibility that tolerates the element not existing yet, so a missing selector
    fails its own check instead of throwing the run away.

    Asks the cascade rather than reading `offsetParent`, which is null for any
    `position: fixed` element whether it is displayed or not — the hairline is fixed,
    so offsetParent would call it hidden at every width. */
const shown = (frame, selector) => {
	const el = frame.doc.querySelector(selector);
	return el ? frame.win.getComputedStyle(el).display !== 'none' : 'missing';
};

async function run() {
	check('browser supports view() timelines', CSS.supports('animation-timeline', 'view()'), 'true');

	const { doc } = await load('/index.html');
	const word = doc.querySelector('#features-heading span');
	const wordStyle = getComputedStyle(word);

	check('heading word is scroll-linked', wordStyle.animationTimeline, (v) => v !== 'auto' && v !== '');
	check('heading word uses the type gesture', wordStyle.animationName, 'reveal-type');
	check('heading word range is authored', wordStyle.animationRange, (v) => v.includes('entry') && v.includes('cover'));
	check('cascade offset differs per word', getComputedStyle(doc.querySelectorAll('#features-heading span')[2]).animationRangeStart,
		(v) => v !== wordStyle.animationRangeStart);
	check('no JS-applied hidden state on the enhanced path', doc.querySelectorAll('.rise').length, '0');

	const fb = await load('/index.html?nolinked');
	check('fallback still applies rise', fb.doc.querySelectorAll('.rise').length, (v) => Number(v) > 0);

	// Regression guard for the hydration flash fixed on 2026-07-26: the observer path
	// must leave anything already painted on the first screen alone, rather than
	// hiding it and fading it back in.
	const firstScreen = [...fb.doc.querySelectorAll('.rise')].filter((el) => {
		const r = el.getBoundingClientRect();
		return r.top < fb.win.innerHeight && r.bottom > 0;
	});
	check('fallback hides nothing already on screen', firstScreen.length, '0');

	const cards = doc.querySelectorAll('#features .glow-field > article');
	check('card uses the surface gesture', getComputedStyle(cards[0]).animationName, 'reveal-surface');
	check('card cascade offsets differ', getComputedStyle(cards[2]).animationRangeStart,
		(v) => v !== getComputedStyle(cards[0]).animationRangeStart);
	check('install lead panel is a surface', getComputedStyle(doc.querySelector('#install .lead')).animationName, 'reveal-surface');

	// The hover response must still compose with the entrance rather than replace it.
	check('card hover still transitions translate', getComputedStyle(cards[0]).transitionProperty,
		(v) => v.includes('translate') && v.includes('scale'));
	// And the observer path must keep the opacity/transform it needs.
	check('fallback card still transitions opacity', getComputedStyle(fb.doc.querySelector('#features .glow-field > article')).transitionProperty,
		(v) => v.includes('opacity') && v.includes('transform'));

	const device = doc.querySelector('.reveal.media');
	check('device is scroll-linked', device && getComputedStyle(device).animationTimeline, (v) => v && v !== 'auto');
	check('device resolves later than type', device && getComputedStyle(device).animationRange, (v) => String(v).includes('20%'));
	check('idle drift survives on its own element', getComputedStyle(doc.querySelector('.float')).animationName, 'float');
	check('drift and entrance are not the same element', doc.querySelectorAll('.reveal.media.float').length, '0');

	const sub = doc.querySelector('#features > p');
	check('features sub-paragraph reveals', getComputedStyle(sub).animationName, 'reveal-type');
	check('sub-paragraph trails its heading', getComputedStyle(sub).animationRangeStart,
		(v) => v !== getComputedStyle(doc.querySelector('#features-heading span')).animationRangeStart);
	check('install sub-paragraph reveals', getComputedStyle(doc.querySelector('#install > p')).animationName, 'reveal-type');

	const narrow = await load('/index.html', 390, 844);
	const bar = narrow.doc.querySelector('header > div');
	const barStyle = narrow.win.getComputedStyle(bar);
	const barBox = bar.getBoundingClientRect();

	check('dock spans the viewport below sm', Math.round(barBox.width), '390');
	check('dock sits flush to the top', Math.round(barBox.top), (v) => Number(v) < 4);
	check('dock has no pill radius below sm', barStyle.borderTopLeftRadius, '0px');
	check('dock clears the status bar', barStyle.paddingTop, (v) => parseFloat(v) >= 8);
	check('dividers are gone below sm', [...bar.querySelectorAll(':scope > span[aria-hidden]')].filter((s) => s.offsetParent !== null).length, '0');
	check('progress hairline hidden below sm', shown(narrow, '.progress'), 'false');

	const wide = await load('/index.html', 1100, 800);
	const pill = wide.doc.querySelector('header > div');
	check('desktop dock is still a pill', wide.win.getComputedStyle(pill).borderTopLeftRadius, (v) => parseFloat(v) > 10);
	check('desktop dock is not full width', Math.round(pill.getBoundingClientRect().width), (v) => Number(v) < 1000);
	check('progress hairline returns at sm and up', shown(wide, '.progress'), 'true');

	await report();
}

function report() {
	return fetch('/__report', {
		method: 'POST',
		headers: { 'content-type': 'application/json' },
		body: JSON.stringify(checks)
	});
}

/* A check that throws must not take the run with it: an unreported probe looks
   identical to a hung browser, and says nothing about which check broke. */
run().catch((error) => {
	check(`probe threw: ${error && error.message}`, error && error.stack, () => false);
	report();
});
</script>
</body>
</html>
