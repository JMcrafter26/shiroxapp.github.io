<!doctype html>
<html>
<body style="margin:0">
<script>
const checks = [];
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function check(name, actual, expected) {
	const pass = typeof expected === 'function' ? expected(actual) : String(actual) === String(expected);
	checks.push({ name, actual: String(actual), pass });
}

/** Loads the built page in an iframe of the given size and resolves once hydrated. */
function load(src, width = 1100, height = 800) {
	return new Promise((resolve) => {
		const frame = document.createElement('iframe');
		frame.style.cssText = `width:${width}px;height:${height}px;border:0`;
		frame.src = src;
		frame.onload = async () => {
			for (let i = 0; i < 100 && !frame.contentWindow.__hydrated; i++) await sleep(50);
			resolve({ doc: frame.contentDocument, win: frame.contentWindow });
		};
		document.body.append(frame);
	});
}

async function run() {
	check('browser supports view() timelines', CSS.supports('animation-timeline', 'view()'), 'true');

	const { doc } = await load('/index.html');
	const word = doc.querySelector('#features-heading span');
	const wordStyle = getComputedStyle(word);

	check('heading word is scroll-linked', wordStyle.animationTimeline, (v) => v !== 'auto' && v !== '');
	check('heading word uses the type gesture', wordStyle.animationName, 'reveal-type');
	check('heading word range is authored', wordStyle.animationRange, (v) => v.includes('entry') && v.includes('cover'));
	check('cascade offset differs per word', getComputedStyle(doc.querySelectorAll('#features-heading span')[2]).animationRangeStart,
		(v) => v !== wordStyle.animationRangeStart);
	check('no JS-applied hidden state on the enhanced path', doc.querySelectorAll('.rise').length, '0');

	const fb = await load('/index.html?nolinked');
	check('fallback still applies rise', fb.doc.querySelectorAll('.rise').length, (v) => Number(v) > 0);

	// Regression guard for the hydration flash fixed on 2026-07-26: the observer path
	// must leave anything already painted on the first screen alone, rather than
	// hiding it and fading it back in.
	const firstScreen = [...fb.doc.querySelectorAll('.rise')].filter((el) => {
		const r = el.getBoundingClientRect();
		return r.top < fb.win.innerHeight && r.bottom > 0;
	});
	check('fallback hides nothing already on screen', firstScreen.length, '0');

	await fetch('/__report', {
		method: 'POST',
		headers: { 'content-type': 'application/json' },
		body: JSON.stringify(checks)
	});
}

run();
</script>
</body>
</html>
