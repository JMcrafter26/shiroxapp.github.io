<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#fafaf9" />
		<!--
			Runs before the first paint, so a visitor who chose dark last time never
			sees a flash of white. Deliberately not module/deferred, and deliberately
			not reading prefers-color-scheme: the page opens light unless this visitor
			asked for otherwise. Kept in sync with src/lib/theme.svelte.ts.
		-->
		<script>
			try {
				if (localStorage.getItem('shirox-theme') === 'dark') {
					document.documentElement.dataset.theme = 'dark';
					document.querySelector('meta[name="theme-color"]').content = '#0b0b0c';
				}
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
